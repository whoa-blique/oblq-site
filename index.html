<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OBLQ Productions</title>
<meta name="description" content="Productions, engineering and releases from OBLQ Productions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --fg: #f2f2f2;
    --muted: #9a9a9a;
    --line: #2a2a2a;
    --gap: clamp(10px, 2vw, 22px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--fg); }
  body {
    font-family: "Space Grotesk", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Tabs ---------- */
  .tabs {
    display: flex; justify-content: center; gap: 6px;
    padding: 0 16px clamp(24px, 4vw, 40px);
  }
  .tabs a {
    color: var(--muted); text-decoration: none;
    font-size: 13px; letter-spacing: .28em; text-transform: uppercase;
    padding: 10px 18px; border: 1px solid transparent;
    transition: color .2s ease, border-color .2s ease;
  }
  .tabs a:hover { color: var(--fg); }
  .tabs a[aria-selected="true"] { color: var(--fg); border-color: var(--line); }
  .miraflores-word { font-size: clamp(36px, 8vw, 84px); letter-spacing: .3em; font-weight: 400; padding-left: .3em; }
  .mythryx-word { font-weight: 700; letter-spacing: .04em; text-transform: lowercase; }

  /* ---------- Header / logo ---------- */
  header {
    display: flex;
    justify-content: center;
    padding: clamp(36px, 8vw, 90px) 20px clamp(20px, 3vw, 32px);
  }
  .logo { width: min(440px, 78vw); height: auto; display: block; }
  .logo-fallback {
    font-size: clamp(54px, 12vw, 120px);
    font-weight: 400;
    letter-spacing: 0.08em;
    line-height: 1;
    text-align: center;
  }
  .logo-fallback small {
    display: block;
    font-size: 0.14em;
    letter-spacing: 0.5em;
    color: var(--muted);
    margin-top: 0.6em;
  }

  /* ---------- Grid of works ---------- */
  main { max-width: 1100px; margin: 0 auto; padding: 0 var(--gap) 80px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--gap);
    list-style: none;
  }
  @media (max-width: 520px) { .grid { grid-template-columns: repeat(2, 1fr); } }

  .work {
    position: relative;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    cursor: pointer;
    background: #151515;
    border: 0;
    width: 100%;
    color: inherit;
    font: inherit;
    display: block;
  }
  .work img, .work .ph {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: filter .35s ease, transform .35s ease;
  }
  .work .ph, .sheet .ph {
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 12px;
    background: linear-gradient(135deg, #1c1c1c, #0f0f0f);
    color: #555; font-size: 14px; letter-spacing: .1em; text-transform: uppercase;
  }
  .info {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    gap: 6px; padding: 14px; text-align: center;
    background: rgba(0,0,0,.35);
    opacity: 0;
    transition: opacity .35s ease;
  }
  .info .title { font-size: clamp(14px, 2vw, 22px); font-weight: 700; line-height: 1.15; }
  .info .artist { font-size: clamp(12px, 1.5vw, 15px); color: #d6d6d6; }
  .work:hover img, .work:focus-visible img,
  .work:hover .ph, .work:focus-visible .ph { filter: blur(8px) brightness(.7); transform: scale(1.06); }
  .work:hover .info, .work:focus-visible .info { opacity: 1; }
  .work:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

  /* Phones/tablets have no hover: show a slim label instead */
  @media (hover: none) {
    .info {
      opacity: 1; justify-content: flex-end; inset: auto 0 0 0;
      background: linear-gradient(transparent, rgba(0,0,0,.85));
      padding-top: 40px;
    }
    .info .title { font-size: 13px; }
    .info .artist { font-size: 11px; }
  }

  /* ---------- Modal ---------- */
  .modal {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    background: rgba(5,5,5,.88);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease;
  }
  .modal.open { opacity: 1; pointer-events: auto; }
  .sheet {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(220px, 300px);
    gap: clamp(18px, 3vw, 36px);
    align-items: center;
    width: min(920px, 100%);
    max-height: 100%;
    overflow: auto;
    transform: scale(.96);
    transition: transform .25s ease;
  }
  .modal.open .sheet { transform: scale(1); }
  .sheet .art { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  .sheet .art.ph { font-size: 18px; display: flex; }
  .details h2 { font-size: clamp(22px, 3vw, 32px); line-height: 1.1; }
  .details .m-artist { color: #cfcfcf; margin-top: 6px; font-size: 17px; }
  .details .m-meta { color: var(--muted); margin-top: 10px; font-size: 14px; }
  .credits { margin-top: 20px; }
  .credits ul { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .credits li { font-size: 13px; padding: 5px 10px; border: 1px solid var(--line); color: #ddd; }
  .listen { margin-top: 22px; display: flex; flex-direction: column; gap: 8px; }
  .listen-label { font-size: 11px; letter-spacing: .25em; color: var(--muted); text-transform: uppercase; margin-bottom: 2px; }
  .listen a {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px;
    border: 1px solid var(--line);
    color: var(--fg); text-decoration: none; font-size: 15px;
    transition: background .2s ease, border-color .2s ease;
  }
  .listen a:hover, .listen a:focus-visible { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .listen a span:last-child { opacity: .6; }
  .close {
    position: fixed; top: 16px; right: 18px;
    background: none; border: 0; color: var(--fg);
    font-size: 34px; line-height: 1; cursor: pointer; padding: 6px 10px;
  }
  @media (max-width: 680px) {
    .sheet { grid-template-columns: 1fr; align-items: start; }
    .sheet .art { max-width: 420px; margin: 0 auto; }
  }

  footer { text-align: center; color: #555; font-size: 12px; letter-spacing: .15em; padding: 0 20px 40px; }

  /* ---------- Beat pad (click the OBLQ diamond) ---------- */
  .logo-wrap { position: relative; }
  .diamond {
    position: absolute; top: 0; bottom: 0; left: 70%; right: 0;
    background: none; border: 0; cursor: pointer; border-radius: 50%;
  }
  .logo-wrap .logo { transition: filter .25s ease; }
  .logo-wrap:has(.diamond:hover) .logo { filter: drop-shadow(0 0 10px rgba(255,255,255,.35)); }
  .diamond:focus-visible { outline: 2px solid var(--fg); outline-offset: 4px; }
  .pad-modal .pad-box { text-align: center; }
  .pad-title { font-size: 11px; letter-spacing: .3em; color: var(--muted); text-transform: uppercase; margin-bottom: 18px; }
  .pads {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    width: min(420px, 86vw); margin: 0 auto;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  .pad {
    aspect-ratio: 1/1; border: 1px solid #333; background: #121212; color: var(--fg);
    font: inherit; font-size: clamp(18px, 4vw, 26px); font-weight: 700; letter-spacing: .05em;
    cursor: pointer; border-radius: 10px; -webkit-tap-highlight-color: transparent;
    transition: background .12s ease, transform .06s ease, box-shadow .12s ease;
  }
  .pad:hover { border-color: #555; }
  .pad.hit { background: var(--fg); color: var(--bg); transform: scale(.96); box-shadow: 0 0 28px rgba(255,255,255,.35); transition: none; }
  .pad-layout { display: flex; align-items: center; justify-content: center; gap: clamp(20px, 4vw, 40px); }
  .sheet-music { text-align: left; }
  @media (min-width: 681px) { .sheet-notes { white-space: nowrap; } }
  .sheet-label { font-size: 11px; letter-spacing: .3em; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; }
  .sheet-notes { font-size: 18px; letter-spacing: .12em; text-transform: uppercase; color: var(--fg); word-break: break-all; line-height: 1.6;
    border: 1px solid var(--line); padding: 12px 14px; }
  @media (max-width: 680px) { .pad-layout { flex-direction: column; } .sheet-music { text-align: center; } }
  .pad-hint { margin-top: 16px; font-size: 12px; color: #666; }
  @media (hover: none) { .pad-hint .kbd { display: none; } }
</style>
</head>
<body>

<header>
  <div id="brand-oblique" class="brand logo-wrap">
    <img class="logo" src="assets/logo.png" alt="OBLQ Productions"
         onerror="this.outerHTML='<div class=&quot;logo-fallback&quot;>OBLQ<small>PRODUCTIONS</small></div>'">
    <button class="diamond" id="diamond" aria-label="Open the beat pad"></button>
  </div>
  <div id="brand-miraflores" class="brand" hidden>
    <img class="logo" src="assets/miraflores-logo.png" alt="Miraflores"
         onerror="this.outerHTML='<div class=&quot;logo-fallback miraflores-word&quot;>MIRAFLORES</div>'">
  </div>
  <div id="brand-mythryx" class="brand" hidden>
    <img class="logo" src="assets/mythryx-logo.png" alt="mythryx"
         onerror="this.outerHTML='<div class=&quot;logo-fallback mythryx-word&quot;>mythryx</div>'">
  </div>
</header>

<nav class="tabs" role="tablist" aria-label="Projects">
  <a href="#oblique" role="tab" data-tab="oblique">Oblique</a>
  <a href="#mythryx" role="tab" data-tab="mythryx">Mythryx</a>
  <a href="#miraflores" role="tab" data-tab="miraflores">Miraflores</a>
</nav>

<main>
  <ul class="grid" id="grid"></ul>
</main>

<footer>© <span id="yr"></span> <span id="foot">OBLQ PRODUCTIONS</span></footer>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
  <button class="close" id="close" aria-label="Close">×</button>
  <div class="sheet" id="sheet"></div>
</div>

<div class="modal pad-modal" id="padModal" role="dialog" aria-modal="true" aria-label="Beat pad">
  <button class="close" id="padClose" aria-label="Close">×</button>
  <div class="pad-box">
    <div class="pad-title">“For Your Love” Chopped</div>
    <div class="pad-layout">
      <div class="pads" id="pads"></div>
      <aside class="sheet-music" aria-label="Sheet music">
        <div class="sheet-label">Sheet Music</div>
        <div class="sheet-notes">qwwweassddzxxcc</div>
      </aside>
    </div>
    <div class="pad-hint"><span class="kbd">Use Q W E · A S D · Z X C, or </span>tap the pads</div>
  </div>
</div>

<script>
/* =====================================================================
   Releases come from releases.json, which GitHub rebuilds every day from
   the "Produced by Oblique" Spotify playlist (see scripts/build-releases.mjs).
   To add YouTube/Apple links or hide something, edit extras.json.
   ===================================================================== */
let WORKS = [];

/* Names shown on the listen buttons, in display order */
const PLATFORMS = {
  spotify: "Spotify",
  apple: "Apple Music",
  youtube: "YouTube",
  youtubeMusic: "YouTube Music",
  amazon: "Amazon Music",
  tidal: "TIDAL",
  soundcloud: "SoundCloud",
  bandcamp: "Bandcamp",
  deezer: "Deezer",
  all: "All platforms",
};

/* ===================================================================== */

const grid = document.getElementById("grid");
const modal = document.getElementById("modal");
const sheet = document.getElementById("sheet");
document.getElementById("yr").textContent = new Date().getFullYear();

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

function coverHTML(w, cls) {
  return `<img class="${cls}" src="${esc(w.cover)}" alt="${esc(w.title)} cover art" loading="lazy"
    onerror="this.outerHTML='<div class=&quot;${cls} ph&quot;>${esc(esc(w.title))}</div>'">`;
}

let sorted = [];

function render() {
grid.innerHTML = sorted.map((w, i) => `
  <li>
    <button class="work" data-i="${i}" aria-label="${esc(w.title)} by ${esc(w.artist)}">
      ${coverHTML(w, "")}
      <span class="info">
        <span class="title">${esc(w.title)}</span>
        <span class="artist">${esc(w.artist)}</span>
      </span>
    </button>
  </li>`).join("");
}

/* Tabs: #oblique (default) and #mythryx. Each loads its own data file. */
const TABS = {
  oblique: { file: "releases.json", title: "OBLQ Productions", foot: "OBLQ PRODUCTIONS" },
  mythryx: { file: "mythryx.json", title: "mythryx", foot: "MYTHRYX" },
  miraflores: { file: "miraflores.json", title: "Miraflores", foot: "MIRAFLORES" },
};
const cache = {};

function showTab() {
  const key = TABS[location.hash.slice(1)] ? location.hash.slice(1) : "oblique";
  document.querySelectorAll(".tabs a").forEach(a => a.setAttribute("aria-selected", a.dataset.tab === key));
  document.querySelectorAll(".brand").forEach(b => b.hidden = b.id !== "brand-" + key);
  document.title = TABS[key].title;
  document.getElementById("foot").textContent = TABS[key].foot;
  const load = cache[key] || (cache[key] = fetch(TABS[key].file, { cache: "no-cache" }).then(r => r.json()));
  load.then(data => {
    if ((TABS[location.hash.slice(1)] ? location.hash.slice(1) : "oblique") !== key) return;
    WORKS = data;
    sorted = [...WORKS].sort((a, b) => String(b.date).localeCompare(String(a.date)) || (a.order ?? 0) - (b.order ?? 0));
    render();
    if (!sorted.length) grid.innerHTML = '<li class="m-meta" style="grid-column:1/-1;text-align:center">New music coming soon.</li>';
  }).catch(() => {
    delete cache[key];
    grid.innerHTML = '<li class="m-meta" style="grid-column:1/-1;text-align:center">Releases are loading — check back in a minute.</li>';
  });
}
window.addEventListener("hashchange", showTab);
showTab();

let lastFocus = null;

function openWork(i) {
  const w = sorted[i];
  const links = Object.keys(PLATFORMS)
    .filter(k => w.links && w.links[k])
    .map(k => `<a href="${esc(w.links[k])}" target="_blank" rel="noopener"><span>${PLATFORMS[k]}</span><span>↗</span></a>`)
    .join("");
  sheet.innerHTML = `
    ${coverHTML(w, "art")}
    <div class="details">
      <h2 id="m-title">${esc(w.title)}</h2>
      <div class="m-artist">${esc(w.artist)}</div>
      ${w.year ? `<div class="m-meta">${esc(w.year)}${w.type ? " · " + esc(w.type) : ""}</div>` : ""}
      ${w.role ? `<div class="credits"><div class="listen-label">My credits</div><ul>${w.role.split(/,\s*/).map(c => `<li>${esc(c)}</li>`).join("")}</ul></div>` : ""}
      <div class="listen">
        <div class="listen-label">Listen on</div>
        ${links || `<div class="m-meta">Links coming soon.</div>`}
      </div>
    </div>`;
  lastFocus = document.activeElement;
  modal.classList.add("open");
  document.body.style.overflow = "hidden";
  document.getElementById("close").focus();
}

function closeModal() {
  modal.classList.remove("open");
  document.body.style.overflow = "";
  if (lastFocus) lastFocus.focus();
}

grid.addEventListener("click", e => {
  const b = e.target.closest(".work");
  if (b) openWork(+b.dataset.i);
});
document.getElementById("close").addEventListener("click", closeModal);
modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && modal.classList.contains("open")) closeModal(); });

/* ===================== Beat pad ===================== */
(() => {
  const KEYS = ["Q","W","E","A","S","D","Z","X","C"];
  const padModal = document.getElementById("padModal");
  const padsEl = document.getElementById("pads");
  padsEl.innerHTML = KEYS.map((k, i) => `<button class="pad" data-i="${i}" aria-label="Pad ${k}">${k}</button>`).join("");
  const padBtns = [...padsEl.children];
  let ctx = null, buffers = [], loading = null, current = null;

  function load() {
    if (loading) return loading;
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();
    loading = Promise.all(KEYS.map((_, i) =>
      fetch(`assets/pads/pad${i + 1}.wav`).then(r => r.arrayBuffer())
        .then(b => new Promise((res, rej) => ctx.decodeAudioData(b, res, rej)))
        .then(buf => (buffers[i] = buf))
        .catch(() => {})
    ));
    return loading;
  }
  function hit(i) {
    if (!ctx) load();
    if (ctx.state === "suspended") ctx.resume();
    const buf = buffers[i];
    // Monophonic: stop whatever is playing before starting the new hit
    if (current) { try { current.stop(); } catch {} current = null; }
    if (buf) { const s = ctx.createBufferSource(); s.buffer = buf; s.connect(ctx.destination); s.start(); current = s; s.onended = () => { if (current === s) current = null; }; }
    const b = padBtns[i];
    b.classList.remove("hit"); void b.offsetWidth; b.classList.add("hit");
    clearTimeout(b._t); b._t = setTimeout(() => b.classList.remove("hit"), 110);
  }
  function openPad() {
    load(); if (ctx.state === "suspended") ctx.resume();
    padModal.classList.add("open"); document.body.style.overflow = "hidden";
    document.getElementById("padClose").focus();
  }
  function closePad() { padModal.classList.remove("open"); document.body.style.overflow = ""; }

  document.getElementById("diamond").addEventListener("click", openPad);
  document.getElementById("padClose").addEventListener("click", closePad);
  padModal.addEventListener("click", e => { if (e.target === padModal) closePad(); });
  // pointerdown = no tap delay on phones; ignore the follow-up click
  padsEl.addEventListener("pointerdown", e => {
    const b = e.target.closest(".pad"); if (!b) return;
    e.preventDefault(); hit(+b.dataset.i);
  });
  padsEl.addEventListener("click", e => {
    const b = e.target.closest(".pad");
    if (b && e.detail === 0) hit(+b.dataset.i); // keyboard Enter/Space on a focused pad
  });
  document.addEventListener("keydown", e => {
    if (!padModal.classList.contains("open")) return;
    if (e.key === "Escape") return closePad();
    if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
    const i = KEYS.indexOf(e.key.toUpperCase());
    if (i >= 0) { e.preventDefault(); hit(i); }
  });
})();
</script>
</body>
</html>
