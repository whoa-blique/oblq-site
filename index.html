<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OBLQ Productions</title>
<meta name="description" content="Productions, engineering and releases from OBLQ Productions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --fg: #f2f2f2;
    --muted: #9a9a9a;
    --line: #2a2a2a;
    --gap: clamp(10px, 2vw, 22px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--fg); }
  body {
    font-family: "Space Grotesk", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header / logo ---------- */
  header {
    display: flex;
    justify-content: center;
    padding: clamp(36px, 8vw, 90px) 20px clamp(28px, 5vw, 56px);
  }
  .logo { width: min(440px, 78vw); height: auto; display: block; }
  .logo-fallback {
    font-size: clamp(54px, 12vw, 120px);
    font-weight: 400;
    letter-spacing: 0.08em;
    line-height: 1;
    text-align: center;
  }
  .logo-fallback small {
    display: block;
    font-size: 0.14em;
    letter-spacing: 0.5em;
    color: var(--muted);
    margin-top: 0.6em;
  }

  /* ---------- Grid of works ---------- */
  main { max-width: 1100px; margin: 0 auto; padding: 0 var(--gap) 80px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--gap);
    list-style: none;
  }
  @media (max-width: 520px) { .grid { grid-template-columns: repeat(2, 1fr); } }

  .work {
    position: relative;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    cursor: pointer;
    background: #151515;
    border: 0;
    width: 100%;
    color: inherit;
    font: inherit;
    display: block;
  }
  .work img, .work .ph {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: filter .35s ease, transform .35s ease;
  }
  .work .ph, .sheet .ph {
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 12px;
    background: linear-gradient(135deg, #1c1c1c, #0f0f0f);
    color: #555; font-size: 14px; letter-spacing: .1em; text-transform: uppercase;
  }
  .info {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    gap: 6px; padding: 14px; text-align: center;
    background: rgba(0,0,0,.35);
    opacity: 0;
    transition: opacity .35s ease;
  }
  .info .title { font-size: clamp(14px, 2vw, 22px); font-weight: 700; line-height: 1.15; }
  .info .artist { font-size: clamp(12px, 1.5vw, 15px); color: #d6d6d6; }
  .work:hover img, .work:focus-visible img,
  .work:hover .ph, .work:focus-visible .ph { filter: blur(8px) brightness(.7); transform: scale(1.06); }
  .work:hover .info, .work:focus-visible .info { opacity: 1; }
  .work:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

  /* Phones/tablets have no hover: show a slim label instead */
  @media (hover: none) {
    .info {
      opacity: 1; justify-content: flex-end; inset: auto 0 0 0;
      background: linear-gradient(transparent, rgba(0,0,0,.85));
      padding-top: 40px;
    }
    .info .title { font-size: 13px; }
    .info .artist { font-size: 11px; }
  }

  /* ---------- Modal ---------- */
  .modal {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    background: rgba(5,5,5,.88);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease;
  }
  .modal.open { opacity: 1; pointer-events: auto; }
  .sheet {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(220px, 300px);
    gap: clamp(18px, 3vw, 36px);
    align-items: center;
    width: min(920px, 100%);
    max-height: 100%;
    overflow: auto;
    transform: scale(.96);
    transition: transform .25s ease;
  }
  .modal.open .sheet { transform: scale(1); }
  .sheet .art { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  .sheet .art.ph { font-size: 18px; display: flex; }
  .details h2 { font-size: clamp(22px, 3vw, 32px); line-height: 1.1; }
  .details .m-artist { color: #cfcfcf; margin-top: 6px; font-size: 17px; }
  .details .m-meta { color: var(--muted); margin-top: 10px; font-size: 14px; }
  .listen { margin-top: 22px; display: flex; flex-direction: column; gap: 8px; }
  .listen-label { font-size: 11px; letter-spacing: .25em; color: var(--muted); text-transform: uppercase; margin-bottom: 2px; }
  .listen a {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px;
    border: 1px solid var(--line);
    color: var(--fg); text-decoration: none; font-size: 15px;
    transition: background .2s ease, border-color .2s ease;
  }
  .listen a:hover, .listen a:focus-visible { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .listen a span:last-child { opacity: .6; }
  .close {
    position: fixed; top: 16px; right: 18px;
    background: none; border: 0; color: var(--fg);
    font-size: 34px; line-height: 1; cursor: pointer; padding: 6px 10px;
  }
  @media (max-width: 680px) {
    .sheet { grid-template-columns: 1fr; align-items: start; }
    .sheet .art { max-width: 420px; margin: 0 auto; }
  }

  footer { text-align: center; color: #555; font-size: 12px; letter-spacing: .15em; padding: 0 20px 40px; }
</style>
</head>
<body>

<header>
  <img class="logo" src="assets/logo.png" alt="OBLQ Productions"
       onerror="this.outerHTML='<div class=&quot;logo-fallback&quot;>OBLQ<small>PRODUCTIONS</small></div>'">
</header>

<main>
  <ul class="grid" id="grid"></ul>
</main>

<footer>© <span id="yr"></span> OBLQ PRODUCTIONS</footer>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
  <button class="close" id="close" aria-label="Close">×</button>
  <div class="sheet" id="sheet"></div>
</div>

<script>
/* =====================================================================
   Releases come from releases.json, which GitHub rebuilds every day from
   the "Produced by Oblique" Spotify playlist (see scripts/build-releases.mjs).
   To add YouTube/Apple links or hide something, edit extras.json.
   ===================================================================== */
let WORKS = [];

/* Names shown on the listen buttons, in display order */
const PLATFORMS = {
  spotify: "Spotify",
  apple: "Apple Music",
  youtube: "YouTube",
  youtubeMusic: "YouTube Music",
  amazon: "Amazon Music",
  tidal: "TIDAL",
  soundcloud: "SoundCloud",
  bandcamp: "Bandcamp",
  deezer: "Deezer",
  all: "All platforms",
};

/* ===================================================================== */

const grid = document.getElementById("grid");
const modal = document.getElementById("modal");
const sheet = document.getElementById("sheet");
document.getElementById("yr").textContent = new Date().getFullYear();

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

function coverHTML(w, cls) {
  return `<img class="${cls}" src="${esc(w.cover)}" alt="${esc(w.title)} cover art" loading="lazy"
    onerror="this.outerHTML='<div class=&quot;${cls} ph&quot;>${esc(esc(w.title))}</div>'">`;
}

let sorted = [];

function render() {
grid.innerHTML = sorted.map((w, i) => `
  <li>
    <button class="work" data-i="${i}" aria-label="${esc(w.title)} by ${esc(w.artist)}">
      ${coverHTML(w, "")}
      <span class="info">
        <span class="title">${esc(w.title)}</span>
        <span class="artist">${esc(w.artist)}</span>
      </span>
    </button>
  </li>`).join("");
}

fetch("releases.json", { cache: "no-cache" })
  .then(r => r.json())
  .then(data => {
    WORKS = data;
    sorted = [...WORKS].sort((a, b) => String(b.date).localeCompare(String(a.date)) || (a.order ?? 0) - (b.order ?? 0));
    render();
  })
  .catch(() => { grid.innerHTML = '<li class="m-meta" style="grid-column:1/-1;text-align:center">Releases are loading — check back in a minute.</li>'; });

let lastFocus = null;

function openWork(i) {
  const w = sorted[i];
  const links = Object.keys(PLATFORMS)
    .filter(k => w.links && w.links[k])
    .map(k => `<a href="${esc(w.links[k])}" target="_blank" rel="noopener"><span>${PLATFORMS[k]}</span><span>↗</span></a>`)
    .join("");
  sheet.innerHTML = `
    ${coverHTML(w, "art")}
    <div class="details">
      <h2 id="m-title">${esc(w.title)}</h2>
      <div class="m-artist">${esc(w.artist)}</div>
      ${w.year ? `<div class="m-meta">${esc(w.year)}${w.type ? " · " + esc(w.type) : ""}</div>` : ""}
      ${w.role ? `<div class="m-meta">${esc(w.role)}</div>` : ""}
      <div class="listen">
        <div class="listen-label">Listen on</div>
        ${links || `<div class="m-meta">Links coming soon.</div>`}
      </div>
    </div>`;
  lastFocus = document.activeElement;
  modal.classList.add("open");
  document.body.style.overflow = "hidden";
  document.getElementById("close").focus();
}

function closeModal() {
  modal.classList.remove("open");
  document.body.style.overflow = "";
  if (lastFocus) lastFocus.focus();
}

grid.addEventListener("click", e => {
  const b = e.target.closest(".work");
  if (b) openWork(+b.dataset.i);
});
document.getElementById("close").addEventListener("click", closeModal);
modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && modal.classList.contains("open")) closeModal(); });
</script>
</body>
</html>
